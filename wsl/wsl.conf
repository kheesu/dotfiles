# /etc/wsl.conf — enables systemd so xrdp can run as a service.
# After the installer copies this in, you MUST restart WSL from Windows:
#     wsl --shutdown
# then relaunch the distro. systemd only takes effect on a fresh boot.

[boot]
systemd=true

[network]
# Keep the Windows-generated hosts/resolv so localhost RDP forwarding works.
generateHosts=true
generateResolvConf=true
